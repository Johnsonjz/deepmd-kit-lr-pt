on:
  workflow_dispatch:
name: Runner smoke
jobs:
  smoke:
    name: Smoke
    runs-on: gpu
    timeout-minutes: 10
    steps:
      - name: Who am I
        run: |
          uname -a
          id
          echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH"
          nvidia-smi --query-gpu=index,name,memory.total --format=csv,noheader
          command -v nvcc && nvcc --version | tail -2
          command -v python3 && python3 -V
          df -h / | tail -1
          free -g | head -2
      - name: Privileges
        run: |
          if sudo -n true 2>/dev/null; then
            echo "passwordless sudo: yes"
          else
            echo "passwordless sudo: no"
          fi
      - name: Network to the runner endpoints
        run: |
          for url in https://api.github.com https://pipelines.actions.githubusercontent.com; do
            printf '%s ' "$url"
            curl -sS -o /dev/null -w '%{http_code}\n' "$url"
          done
