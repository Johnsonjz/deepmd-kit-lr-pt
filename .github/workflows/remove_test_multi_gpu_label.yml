on:
  pull_request_target:
    types:
      - "labeled"
name: Test Multi GPU
jobs:
  remove_label:
    permissions:
      contents: read
      pull-requests: write
    # so one can re-trigger the multi-GPU job without manually removing the
    # label, mirroring the "Test CUDA" label flow
    runs-on: ubuntu-slim
    if: github.repository_owner == 'deepmodeling' && github.event.label.name == 'Test Multi GPU'
    steps:
      - uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: Test Multi GPU
          number: ${{ github.event.pull_request.number }}
