on:
  # manually trigger
  workflow_dispatch:
  pull_request:
    types:
      - "labeled"
      # to let the PR pass the test
      - "opened"
      - "reopened"
      - "synchronize"
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
name: Test CUDA
env:
  # Temporarily disable Paddle in CUDA CI while its external downloads are
  # unreliable. Keep this switch explicit so the coverage can be restored.
  DP_CI_ALLOW_MISSING_PADDLE: "1"
  DP_ENABLE_PADDLE: "0"
jobs:
  test_python:
    name: Test Python on CUDA (${{ matrix.shard }})
    runs-on: gpu
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: pt_expt-model
            pytest-args: source/tests/pt_expt/model
          - shard: pt_expt-other
            pytest-args: source/tests/pt_expt --ignore=source/tests/pt_expt/model
          - shard: other
            pytest-args: source/tests --ignore=source/tests/pt_expt
    # Each shard has its own CUDA build and can take several hours.
    timeout-minutes: 480
    # https://github.com/deepmodeling/deepmd-kit/pull/2884#issuecomment-1744216845
    # container:
    #   image: nvidia/cuda:12.9.1-cudnn-devel-ubuntu22.04
    #   options: --gpus all
    if: (github.repository_owner == 'deepmodeling' || vars.SELF_CI == '1') && (github.event_name == 'pull_request' && github.event.label && github.event.label.name == 'Test CUDA' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          # cache: 'pip'
      - name: Install wget and unzip
        run: |
          # A self-hosted runner without passwordless sudo keeps its own tools.
          if command -v wget >/dev/null 2>&1 && command -v unzip >/dev/null 2>&1; then
            echo "wget and unzip are present"
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y wget unzip
      - uses: lukka/get-cmake@latest
        with:
          useLocalCache: true
          useCloudCache: false
      - run: |
          # This fork runs on a self-hosted Rocky 8 box with its own toolkit;
          # CUDA_HOME (set by the runner) selects it, so the AOTI builds and the
          # C++ tests see the same CUDA as the torch wheel.
          CUDA_HOME=${CUDA_HOME:-/usr/local/cuda}
          CUDA_BIN=$CUDA_HOME/bin
          echo "CUDA toolkit: $("$CUDA_BIN/nvcc" --version | tail -1)"
          echo "CUDA_HOME=$CUDA_HOME" >> "$GITHUB_ENV"
          echo "CUDA_PATH=$CUDA_HOME" >> "$GITHUB_ENV"
          echo "$CUDA_BIN" >> "$GITHUB_PATH"
        # if: false # skip as we use nvidia image
      - run: python -m pip install -U uv
      - run: source/install/uv_with_retry.sh pip install --system --group pin_tensorflow_gpu --group pin_pytorch_gpu --group pin_jax_gpu
      - run: |
          export PYTORCH_ROOT=$(python -c 'import torch;print(torch.__path__[0])')
          export TENSORFLOW_ROOT=$(python -c 'import importlib.util,pathlib;print(pathlib.Path(importlib.util.find_spec("tensorflow").origin).parent)')
          source/install/uv_with_retry.sh pip install --system -v -e .[gpu,test,lmp,cu12,torch,jax] mpi4py --reinstall-package deepmd-kit
          # See https://github.com/jax-ml/jax/issues/29042
          source/install/uv_with_retry.sh pip install --system -U 'nvidia-cublas-cu12>=12.9.0.13'
        env:
          DP_VARIANT: cuda
          DP_ENABLE_NATIVE_OPTIMIZATION: 1
          DP_ENABLE_PYTORCH: 1
          # The float64 DPA4 training kernels serve the consistency tests only.
          CMAKE_ARGS: -DDEEPMD_ENABLE_DPA4_FP64=ON
      - run: dp --version
      - name: Verify float64 CUDA kernels are enabled
        run: |
          python -c "import torch; import deepmd.pt.cxx_op; from deepmd.pt_expt.kernels.cuda.dpa4.so2_conv_train import op_available, float64_available; assert torch.cuda.is_available(); assert op_available(); assert float64_available() is True"
      - name: Test Python
        run: >-
          python -m pytest ${{ matrix.pytest-args }} --ignore=source/tests/pd
          --junitxml=test-reports/python-${{ matrix.shard }}.xml
          -o junit_duration_report=total
        env:
          NUM_WORKERS: 0
          CUDA_VISIBLE_DEVICES: 0
          # See https://jax.readthedocs.io/en/latest/gpu_memory_allocation.html
          XLA_PYTHON_CLIENT_PREALLOCATE: false
          XLA_PYTHON_CLIENT_ALLOCATOR: platform
          FLAGS_use_stride_compute_kernel: 0
      - name: Upload Python test reports
        if: ${{ always() && hashFiles('test-reports/python-*.xml') != '' }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: python-cuda-${{ matrix.shard }}
          path: test-reports/python-*.xml
          if-no-files-found: ignore
          retention-days: 14

  test_cc:
    name: Test ${{ matrix.name }} on CUDA
    runs-on: gpu
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: main
            name: C++
          - suite: kokkos
            name: Kokkos
    if: (github.repository_owner == 'deepmodeling' || vars.SELF_CI == '1') && (github.event_name == 'pull_request' && github.event.label && github.event.label.name == 'Test CUDA' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group')
    steps:
      # Jobs run on separate runners, so the C++ job needs its own complete
      # CUDA toolchain and Python dependency installation.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          # cache: 'pip'
      - name: Install build prerequisites
        run: |
          # A self-hosted runner without passwordless sudo keeps its own tools.
          if command -v wget >/dev/null 2>&1 && command -v unzip >/dev/null 2>&1; then
            echo "wget and unzip are present"
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y wget unzip
      - uses: lukka/get-cmake@latest
        with:
          useLocalCache: true
          useCloudCache: false
      - run: |
          # This fork runs on a self-hosted Rocky 8 box with its own toolkit;
          # CUDA_HOME (set by the runner) selects it, so the AOTI builds and the
          # C++ tests see the same CUDA as the torch wheel.
          CUDA_HOME=${CUDA_HOME:-/usr/local/cuda}
          CUDA_BIN=$CUDA_HOME/bin
          echo "CUDA toolkit: $("$CUDA_BIN/nvcc" --version | tail -1)"
          echo "CUDA_HOME=$CUDA_HOME" >> "$GITHUB_ENV"
          echo "CUDA_PATH=$CUDA_HOME" >> "$GITHUB_ENV"
          echo "$CUDA_BIN" >> "$GITHUB_PATH"
        # if: false # skip as we use nvidia image
      - run: python -m pip install -U uv
      - run: source/install/uv_with_retry.sh pip install --system --group pin_tensorflow_gpu --group pin_pytorch_gpu --group pin_jax_gpu
      - run: |
          export PYTORCH_ROOT=$(python -c 'import torch;print(torch.__path__[0])')
          export TENSORFLOW_ROOT=$(python -c 'import importlib.util,pathlib;print(pathlib.Path(importlib.util.find_spec("tensorflow").origin).parent)')
          # Use the LAMMPS wheel's MPI distribution for every build and launch.
          # Ubuntu 24.04 MPICH can start independent singleton worlds:
          # https://github.com/mpi4py/mpi4py/issues/547
          source/install/uv_with_retry.sh pip install --system mpich
          export MPI_HOME=$(python -c 'import sys; print(sys.prefix)')
          export MPICC=$MPI_HOME/bin/mpicc
          export LD_LIBRARY_PATH=$MPI_HOME/lib:${LD_LIBRARY_PATH:-}
          echo "MPI_HOME=$MPI_HOME" >> "$GITHUB_ENV"
          source/install/uv_with_retry.sh pip install --system -v -e .[gpu,test,lmp,cu12,torch,jax] mpi4py --reinstall-package deepmd-kit --reinstall-package mpi4py --no-binary mpi4py
          # See https://github.com/jax-ml/jax/issues/29042
          source/install/uv_with_retry.sh pip install --system -U 'nvidia-cublas-cu12>=12.9.0.13'
        env:
          DP_VARIANT: cuda
          DP_ENABLE_NATIVE_OPTIMIZATION: 1
          DP_ENABLE_PYTORCH: 1
      - run: dp --version
      - name: Verify the two-rank MPI runtime
        run: |
          export LD_LIBRARY_PATH=$MPI_HOME/lib:${LD_LIBRARY_PATH:-}
          timeout 60 "$MPI_HOME/bin/mpiexec" -n 2 python -c '
          import os
          from pathlib import Path
          from mpi4py import MPI
          comm = MPI.COMM_WORLD
          assert comm.size == 2, MPI.Get_library_version()
          assert comm.allgather(comm.rank) == [0, 1]
          libraries = {
              Path(line.split()[-1]).resolve()
              for line in Path("/proc/self/maps").read_text().splitlines()
              if Path(line.split()[-1]).name.startswith("libmpi")
          }
          expected = (Path(os.environ["MPI_HOME"]) / "lib").resolve()
          assert libraries and all(p.parent == expected for p in libraries), libraries
          if comm.rank == 0:
              print(MPI.Get_library_version(), libraries)
          '
      - name: Test the default CUDA dtype contract
        run: |
          python -c "import torch; import deepmd.pt.cxx_op; from deepmd.pt_expt.kernels.cuda.dpa4.so2_conv_train import op_available, float64_available; assert torch.cuda.is_available(); assert op_available(); assert float64_available() is False"
          python -m pytest source/tests/pt_expt/kernels/test_so2_value_train.py -k unsupported_value_dtypes
        env:
          CUDA_VISIBLE_DEVICES: 0
          OMP_NUM_THREADS: 1
      - name: Convert models
        if: matrix.suite == 'main'
        run: source/tests/infer/convert-models.sh
      - name: Build and test C++
        if: matrix.suite == 'main'
        run: |
          export LD_LIBRARY_PATH=$MPI_HOME/lib:$CUDA_PATH/lib64:/usr/lib/x86_64-linux-gnu/:$LD_LIBRARY_PATH
          source/install/test_cc_local.sh
        env:
          OMP_NUM_THREADS: 1
          TF_INTRA_OP_PARALLELISM_THREADS: 1
          TF_INTER_OP_PARALLELISM_THREADS: 1
          CMAKE_GENERATOR: Ninja
          DP_VARIANT: cuda
          ENABLE_PADDLE: FALSE
      - name: Prepare the Kokkos C API and long-range fixtures
        if: matrix.suite == 'kokkos'
        run: |
          export LD_LIBRARY_PATH=$MPI_HOME/lib:$CUDA_PATH/lib64:/usr/lib/x86_64-linux-gnu/:${LD_LIBRARY_PATH:-}
          source/install/test_cc_local.sh --build-only
          source/install/test_cc_local.sh --models-only=kokkos
        env:
          LAMMPS_VERSION: patch_4Jul2026
          CMAKE_GENERATOR: Ninja
          DP_VARIANT: cuda
          ENABLE_PADDLE: FALSE
          CUDA_VISIBLE_DEVICES: 0
          OMP_NUM_THREADS: 1
          TF_INTRA_OP_PARALLELISM_THREADS: 1
          TF_INTER_OP_PARALLELISM_THREADS: 1
      - name: Test CUDA Kokkos LAMMPS
        if: matrix.suite == 'kokkos'
        run: |
          export LD_LIBRARY_PATH=$MPI_HOME/lib:$CUDA_PATH/lib64:/usr/lib/x86_64-linux-gnu/:${LD_LIBRARY_PATH:-}
          # CUDA 12.8 rejects the -std=c++2a alias that the bundled Kokkos
          # nvcc_wrapper derives from -std=gnu++2a; use the C++20 spelling.
          wrapper=$(find source/build_tests/_deps/lammps_download-src/lib/kokkos/bin -name nvcc_wrapper 2>/dev/null | head -1)
          if [ -n "$wrapper" ]; then sed -i 's/c++2a/c++20/g' "$wrapper"; fi
          source/install/test_lammps_kokkos.sh
        env:
          CMAKE_GENERATOR: Ninja
          DP_VARIANT: cuda
          CUDA_VISIBLE_DEVICES: 0
          OMP_NUM_THREADS: 1
          TF_INTRA_OP_PARALLELISM_THREADS: 1
          TF_INTER_OP_PARALLELISM_THREADS: 1
      - name: Test LAMMPS and i-PI
        if: matrix.suite == 'main'
        run: |
          export LD_LIBRARY_PATH=$MPI_HOME/lib:$CUDA_PATH/lib64:/usr/lib/x86_64-linux-gnu/:$GITHUB_WORKSPACE/dp_test/lib:$LD_LIBRARY_PATH
          export PATH=$GITHUB_WORKSPACE/dp_test/bin:$PATH
          source/install/pytest_with_junit.sh lammps python -m pytest -s source/lmp/tests || (cat log.lammps && exit 1)
          source/install/pytest_with_junit.sh ipi python -m pytest source/ipi/tests
        env:
          OMP_NUM_THREADS: 1
          TF_INTRA_OP_PARALLELISM_THREADS: 1
          TF_INTER_OP_PARALLELISM_THREADS: 1
          LAMMPS_PLUGIN_PATH: ${{ github.workspace }}/dp_test/lib/deepmd_lmp
          DPA4SPIN_LMP_REQUIRED: 1
          CUDA_VISIBLE_DEVICES: 0
          ENABLE_PADDLE: 0
      - name: Test long-range multi-rank
        if: matrix.suite == 'main'
        run: |
          export LD_LIBRARY_PATH=$MPI_HOME/lib:$CUDA_PATH/lib64:/usr/lib/x86_64-linux-gnu/:$LD_LIBRARY_PATH
          export PATH=$MPI_HOME/bin:$PATH
          source/install/test_long_range_mpi.sh
        env:
          OMP_NUM_THREADS: 1
          CUDA_VISIBLE_DEVICES: 0
          DP_LONG_RANGE_RANKS: "2"
      - name: Upload C++ test reports
        if: ${{ always() && hashFiles('source/build_tests/generator-reports/**', 'source/build_tests/gtest-reports/**', 'source/build_tests/pytest-reports/**', 'source/build_lammps_kokkos/test-reports/**') != '' }}
        uses: actions/upload-artifact@v7
        continue-on-error: true
        with:
          name: cpp-cuda-${{ matrix.suite }}
          path: |
            source/build_tests/generator-reports/**
            source/build_tests/gtest-reports/**
            source/build_tests/pytest-reports/**
            source/build_lammps_kokkos/test-reports/**
          if-no-files-found: ignore
          retention-days: 14
  test_long_range_multi_gpu:
    # Opt-in, separate from the pass gate: the per-rank device binding needs a
    # runner with at least two GPUs.  Point the repository variable
    # DP_MULTI_GPU_RUNNER at such a runner and label a pull request
    # "Test Multi GPU"; without the variable the job falls back to the single
    # GPU runner, where every rank binds to device 0 and the multi-rank legs
    # still run.
    name: Test long-range MPI and multi-GPU
    runs-on: ${{ vars.DP_MULTI_GPU_RUNNER || 'gpu' }}
    if: (github.repository_owner == 'deepmodeling' || vars.SELF_CI == '1') && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label && github.event.label.name == 'Test Multi GPU'))
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: lukka/get-cmake@latest
        with:
          useLocalCache: true
          useCloudCache: false
      - run: |
          # This fork runs on a self-hosted Rocky 8 box with its own toolkit;
          # CUDA_HOME (set by the runner) selects it, so the AOTI builds and the
          # C++ tests see the same CUDA as the torch wheel.
          CUDA_HOME=${CUDA_HOME:-/usr/local/cuda}
          CUDA_BIN=$CUDA_HOME/bin
          echo "CUDA toolkit: $("$CUDA_BIN/nvcc" --version | tail -1)"
          echo "CUDA_HOME=$CUDA_HOME" >> "$GITHUB_ENV"
          echo "CUDA_PATH=$CUDA_HOME" >> "$GITHUB_ENV"
          echo "$CUDA_BIN" >> "$GITHUB_PATH"
      - run: python -m pip install -U uv
      - run: source/install/uv_with_retry.sh pip install --system --group pin_tensorflow_gpu --group pin_pytorch_gpu
      - run: |
          export PYTORCH_ROOT=$(python -c 'import torch;print(torch.__path__[0])')
          export TENSORFLOW_ROOT=$(python -c 'import importlib.util,pathlib;print(pathlib.Path(importlib.util.find_spec("tensorflow").origin).parent)')
          source/install/uv_with_retry.sh pip install --system mpich
          export MPI_HOME=$(python -c 'import sys; print(sys.prefix)')
          export MPICC=$MPI_HOME/bin/mpicc
          echo "MPI_HOME=$MPI_HOME" >> "$GITHUB_ENV"
          source/install/uv_with_retry.sh pip install --system -v -e .[gpu,test,lmp,cu12,torch] mpi4py --reinstall-package deepmd-kit --reinstall-package mpi4py --no-binary mpi4py
        env:
          DP_VARIANT: cuda
          DP_ENABLE_NATIVE_OPTIMIZATION: 1
          DP_ENABLE_PYTORCH: 1
      - run: dp --version
      - name: Test long-range multi-rank
        run: |
          export LD_LIBRARY_PATH=$MPI_HOME/lib:$CUDA_PATH/lib64:/usr/lib/x86_64-linux-gnu/:$LD_LIBRARY_PATH
          export PATH=$MPI_HOME/bin:$PATH
          source/install/test_long_range_mpi.sh
        env:
          OMP_NUM_THREADS: 1
          DP_LONG_RANGE_RANKS: "2 4"
          DP_LONG_RANGE_TIMEOUT: "1800"

  pass:
    name: Pass testing on CUDA
    needs: [test_python, test_cc]
    # A fork without GitHub-hosted runners needs the gate on the same machine.
    runs-on: gpu
    if: always()
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
          # Require all Python, C++, and Kokkos matrix jobs on requested GPU runs.
          allowed-skips: ${{ !((github.repository_owner == 'deepmodeling' || vars.SELF_CI == '1') && (github.event_name == 'pull_request' && github.event.label && github.event.label.name == 'Test CUDA' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group')) && 'test_python, test_cc' || '' }}
